apply plugin: 'com.android.application'

android {
    namespace = "it.doctorcar.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "it.doctorcar.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 30
        versionName "2.4.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // firma della versione da installare: le chiavi stanno in firma/ (fuori da git; NON perderle: senza, niente aggiornamenti)
    def firmaFile = rootProject.file('../firma/firma.properties')
    signingConfigs {
        release {
            if (firmaFile.exists()) {
                def p = new Properties()
                firmaFile.withInputStream { p.load(it) }
                storeFile file(p['storeFile'])
                storePassword p['storePassword']
                keyAlias p['keyAlias']
                keyPassword p['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (firmaFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.biometric:biometric:1.1.0"   // impronta o PIN del telefono per aprire l'app
    // fotocamera di DoctorCar (la stessa di DoctorWood): anteprima a tutto schermo, flash, HDR, griglia, formato
    implementation "androidx.camera:camera-core:1.5.3"
    implementation "androidx.camera:camera-camera2:1.5.3"
    implementation "androidx.camera:camera-lifecycle:1.5.3"
    implementation "androidx.camera:camera-view:1.5.3"
    implementation "androidx.camera:camera-extensions:1.5.3"   // HDR del produttore, dove c'è
    implementation "androidx.exifinterface:exifinterface:1.4.2"
    implementation "pairwood:pairwood-capacitor:0.19.0"   // sincronizzazione diretta (PairWood, codice nostro)
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
